# Item database: one entry per item. Shown by <ItemDatabase /> on the Item Database page (filters, sorting).
# This is a curated starter set, not a full game database. Add what the guide needs and you can source.
#
# Required:
#   id        unique, lowercase with hyphens ("raw-leather")
#   name      the item name exactly as in game
#   category  material | consumable | currency | equipment
#   ref       https:// link to where you got the facts (a guide, wiki or screenshot host)
#   checked   the day you checked it, in quotes: "2026-10-10"
#   obtain and/or use   where it comes from / what it is for (short sentences, **bold** allowed)
# Optional:
#   type      free text: Ore, Log, Herb, Gloves, Guard ... (the Type filter lists what is used)
#   grade     Common | Rare | Epic | Unique | Hero | Special (leave out when unknown)
#   level     the level needed to use or gather it (whole number)
#   itemLevel the item level (equipment)
#   faction   both (default) | asmodian | elyos
#   tradable  true | false
#   note      one short extra line shown under the name
#   pages     guide pages to link to, by file name ("Raw Leather" or "raw-leather")
#
# Unknown is fine: leave a field out instead of guessing. After editing run `npm run check`.

- id: raw-leather
  name: Raw Leather
  category: material
  type: Leather
  grade: Common
  level: 15
  tradable: true
  note: "Stacks to 10,000. Vendor price 9 Kina (a floor). Raw Leather (Bound) is a separate item that cannot be traded."
  obtain: "Monster drop, not a node: 140+ monsters from level 10 to 53. Most common monsters give **5.8%** per kill since the Oct 7 2026 update, named monsters up to **62.2%**."
  use: "Strong Leather, the base of armor recipes."
  pages: [Raw Leather, Leather Farming by Level]
  ref: https://allthings.how/aion-2-how-to-farm-raw-leather/
  checked: "2026-10-10"

