# The playable classes, in the order they appear in the guide.
# id:      lowercase name, used as the file name of the class guide (docs/11-classes/<id>.md).
# name:    the name shown in the game (Global client).
# role:    what the class does in a group, a few words.
# weapon:  the weapon it uses.
# note:    optional, one short sentence (for example an alternative name).
# source:  where the information comes from, as a markdown link.
# checked: the date you last checked the row, "YYYY-MM-DD".
# A class guide is a page written with the template (see "Write a class guide" in the Contribute section).

