# Raw Leather: monsters that drop it, per faction. Rates are the values after the Oct 7 2026 update.
# Sources: AllThings.How raw leather guide and Oct 7 update (see Sources).
#
# level: "11", "11–16" or "—" when unknown. Markdown bold (**36**) is allowed in every text field.
# mob:   the monster's name exactly as in game.     where: zones where it spawns.
# rate:  drop chance as text, for example "5.8%" or "~5.8%". Used for sorting and shown as written.
# extra: other drops or tips (column "Also drops" for Asmodian, "Notes" for Elyos).
#
# Add a row by copying a line. Rows are shown in the order of this file, sorted by level.
# After editing run `npm run data`, then `npm run check`.

