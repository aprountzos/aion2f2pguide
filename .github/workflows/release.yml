name: Release

# When a release is merged into main (dev -> main), this tags the version from package.json (v0.0.2, ...)
# and publishes a GitHub Release with the matching CHANGELOG.md notes. It does nothing when that
# version is already tagged, so ordinary merges to main are harmless.
# The site itself is deployed by deploy.yml, which also runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needs the existing tags

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether it is already released
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged, nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the release notes from CHANGELOG.md
        if: steps.tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/check-release.mjs --notes "${VERSION}" > release-notes.md

      - name: Create the tag and the GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
