name: Deploy to GitHub Pages

# Builds the site and publishes it every time something is merged into main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: "last updated by" on every page comes from git

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the pages
        run: npm run lint

      - name: Build the site
        # Fails on broken links. The site URL and base path are derived from the repository
        # name (see scripts/site-meta.mjs), so no configuration is needed here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # contributors list on the Contributors page
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
