version: 2
updates:
  # Docusaurus and other npm packages
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      docusaurus:
        patterns: ['@docusaurus/*']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['@docusaurus/*']

  # The actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
