name: Report a site bug
description: A broken link, a table that does not display, search or layout problems.
title: 'Bug: '
labels: [site-bug]
body:
  - type: input
    id: page
    attributes:
      label: Page address
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: What did you expect, and what happened instead? Screenshots are welcome.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome on Android, Safari on iPhone, Firefox on Windows...
